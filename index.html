<!DOCTYPE html>
<html lang="en">
<head>

  <meta
    name="description"
    content="Viteya is an event planning and invitation app that helps hosts organize events and keep guests informed."

  <style>
    * {
      box-sizing: border-box;

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #ffffff;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 48px;
      line-height: 1.1;
    }

    .tagline {
      margin: 0 0 24px;
      font-size: 22px;
      font-weight: 600;
    }

    .description {
      max-width: 620px;
      margin: 0 auto 40px;
      font-size: 17px;
      line-height: 1.7;
      color: #4b5563;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    a {
      color: #111827;
