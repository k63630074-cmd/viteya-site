  <h1>Privacy Policy</h1>
  <p class="updated">Effective date: October 19, 2026</p>

  <p>
    Viteya is an event planning and invitation application that helps
    people create events, invite guests, coordinate event details, and
    communicate important event information.
  </p>

  <p>
    This Privacy Policy explains the types of information Viteya may
    collect, how that information is used, and the choices available to
    users and event guests.
  </p>

  <h2>Information We Collect</h2>

  <p>Depending on how you use Viteya, we may collect information such as:</p>

  <ul>
    <li>Account and profile information, such as your name, username, email address, and profile information.</li>
    <li>Event information, including event names, descriptions, dates, times, locations, invitations, announcements, and other event details.</li>
    <li>Guest information provided for event coordination, such as a guest's name, email address, mobile phone number, RSVP status, and event participation information.</li>
    <li>Information you choose to provide through event planning features, including lists, links, tasks, payments or gift tracking, music-related features, and other event content.</li>
    <li>Technical information reasonably necessary to operate, secure, maintain, and improve the service.</li>
  </ul>

  <h2>How We Use Information</h2>

  <p>We may use information collected through Viteya to:</p>

  <ul>
    <li>Provide and operate Viteya's event planning and invitation features.</li>
    <li>Create and display invitations and event information.</li>
    <li>Manage guest lists and RSVP information.</li>
    <li>Deliver event communications requested or authorized through Viteya.</li>
    <li>Send important event announcements, reminders, date or time changes, and cancellation notices.</li>
    <li>Maintain the security, reliability, and functionality of Viteya.</li>
    <li>Respond to support requests and troubleshoot problems.</li>
  </ul>

  <h2>SMS and Mobile Messaging</h2>

  <p>
    Viteya may allow event guests to opt in to receive transactional SMS
    messages related to events. These messages may include event
    announcements, reminders, date or time changes, cancellations, and
    other important event updates.
  </p>

  <p>
    Message frequency varies depending on the event and communications
    sent by the event host. Message and data rates may apply. Consent to
    receive SMS messages is not required to use an invitation or RSVP to
    an event. Recipients may reply STOP to opt out of SMS messages and
    HELP for help.
  </p>

  <p>
    Mobile information and SMS consent information will not be sold,
    rented, or shared with third parties or affiliates for their
    marketing or promotional purposes. Information may be provided to
    service providers only as necessary to operate and deliver Viteya's
    messaging and other services.
  </p>

  <h2>Service Providers</h2>

  <p>
    Viteya may use third-party service providers to provide infrastructure,
    communications, data storage, security, and other functionality
    necessary to operate the service. These providers may process
    information on Viteya's behalf only as necessary to provide their
    services.
  </p>

  <h2>Information Sharing</h2>

  <p>
    We do not sell personal information. We may share information with
    service providers when reasonably necessary to operate Viteya,
    provide requested functionality, deliver communications, maintain
    security, comply with applicable legal obligations, or protect the
    rights and safety of users and others.
  </p>

  <p>
    Personal information, including mobile information and SMS consent,
    is not shared with third parties for their independent marketing or
    promotional purposes.
  </p>

  <h2>Data Retention</h2>

  <p>
    Information may be retained for as long as reasonably necessary to
    provide Viteya, maintain event records, comply with legal obligations,
    resolve disputes, enforce agreements, and maintain the security and
    integrity of the service.
  </p>

  <h2>Security</h2>

  <p>
    We use reasonable administrative and technical measures designed to
    protect information. No method of electronic transmission or storage,
    however, can be guaranteed to be completely secure.
  </p>

  <h2>Your Choices</h2>

  <p>
    Users and guests may choose whether to provide certain information.
    SMS recipients may opt out of Viteya SMS communications by replying
    STOP. Where applicable, users may also request assistance regarding
    their information or account.
  </p>

  <h2>Children's Privacy</h2>

  <p>
    Viteya is not intended to knowingly collect personal information from
    children in violation of applicable law.
  </p>

  <h2>Changes to This Privacy Policy</h2>

  <p>
    We may update this Privacy Policy as Viteya evolves. When material
    changes are made, the effective date displayed on this page may be
    updated.
  </p>

  <h2>Contact</h2>

  <p>
    Questions about this Privacy Policy or Viteya's privacy practices may
    be submitted through Viteya's support channels.
  </p>
